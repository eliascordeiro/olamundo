spring.application.name=olamundo
server.port=${PORT:8081}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/business_portal}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.session.secure-cookie=${SESSION_COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/api/docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.paths-to-match=/api/**
app.api-docs.enabled=${API_DOCS_ENABLED:false}
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
